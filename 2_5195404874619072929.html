*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}
:root{--caramel:#D4A574;--choc:#8B5A3C;--dark:#3E2723;--cream:#FFF8F0;--linen:#FAF0E6;--terra:#C97B5A;--wheat:#E8C89A;--ok:#6B8E5A;--warn:#E0A458;--err:#C0392B;--info:#5B8FA8}
body{background:var(--cream);color:var(--dark);min-height:100vh}
button{cursor:pointer;border:none;font-family:inherit}

.login{min-height:100vh;background:linear-gradient(135deg,#FFF8F0,#F5E6D3,#E8D4B8);padding:30px 20px}
.login-head{text-align:center;margin-bottom:24px}
.logo{width:90px;height:90px;margin:0 auto 10px}
.brand{font-size:26px;font-weight:700;color:var(--dark)}
.sub{font-size:13px;color:var(--choc);margin-top:4px;opacity:.8}
.wrap{max-width:1200px;margin:0 auto}
.group{background:white;border-radius:16px;padding:20px;margin-bottom:16px;box-shadow:0 4px 20px rgba(62,39,35,.08)}
.group-title{font-size:15px;font-weight:700;margin-bottom:14px;display:flex;align-items:center;gap:10px}
.group-title::before{content:'';width:4px;height:18px;background:var(--caramel);border-radius:2px}
.badge{background:var(--caramel);color:var(--dark);font-size:11px;font-weight:700;padding:2px 8px;border-radius:8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.card{background:var(--cream);border:1.5px solid rgba(212,165,116,.2);border-radius:12px;padding:14px;display:flex;gap:12px;align-items:center;transition:all .2s;cursor:pointer}
.card:hover{border-color:var(--caramel);background:white;transform:translateY(-2px);box-shadow:0 4px 20px rgba(62,39,35,.08)}
.av{width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,var(--caramel),var(--terra));display:flex;align-items:center;justify-content:center;color:white;font-weight:700;font-size:14px;flex-shrink:0}
.info{flex:1;min-width:0}
.nm{font-size:13px;font-weight:700;margin-bottom:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rl{font-size:11px;color:var(--choc);opacity:.85}
.ps{font-size:10px;color:var(--choc);margin-top:3px;font-family:monospace;background:var(--linen);padding:1px 6px;border-radius:4px;display:inline-block}
.go{background:var(--dark);color:white;padding:8px 14px;border-radius:8px;font-size:12px;font-weight:600;flex-shrink:0}

.app{display:none;min-height:100vh}
.app.on{display:flex}
.side{width:280px;background:linear-gradient(180deg,var(--dark),#2A1A14);color:white;padding:24px 0;position:fixed;height:100vh;overflow-y:auto;z-index:100}
.side-head{padding:0 24px 24px;border-bottom:1px solid rgba(255,255,255,.1);display:flex;align-items:center;gap:12px}
.side-logo{width:44px;height:44px;flex-shrink:0}
.side-brand{font-size:16px;font-weight:700;line-height:1.2}
.side-brand small{display:block;font-size:11px;opacity:.6;font-weight:400;margin-top:2px}
.ucard{margin:20px 16px;padding:14px;background:rgba(255,255,255,.06);border-radius:14px;border:1px solid rgba(255,255,255,.08)}
.uav{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,var(--caramel),var(--terra));display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;color:white;margin-bottom:10px}
.uname{font-size:14px;font-weight:600;margin-bottom:2px}
.urole{font-size:11px;opacity:.7}
.ulevel{display:inline-block;background:var(--caramel);color:var(--dark);font-size:10px;font-weight:700;padding:2px 8px;border-radius:10px;margin-top:6px}
.nav{padding:8px 12px}
.nav-item{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:10px;color:rgba(255,255,255,.75);font-size:14px;cursor:pointer;margin-bottom:2px}
.nav-item:hover{background:rgba(255,255,255,.08);color:white}
.nav-item.on{background:linear-gradient(135deg,var(--caramel),var(--terra));color:white;font-weight:600}
.logout{margin:16px;padding:11px;background:rgba(192,57,43,.15);color:#FFB4A9;border-radius:10px;font-size:13px;font-weight:600;width:calc(100% - 32px);display:flex;align-items:center;justify-content:center;gap:8px}
.logout:hover{background:rgba(192,57,43,.25)}

.main{flex:1;margin-left:280px;padding:32px;min-height:100vh}
.hero{background:linear-gradient(135deg,var(--dark),var(--choc));border-radius:20px;padding:32px;color:white;margin-bottom:24px;position:relative;overflow:hidden}
.hero::before{content:'';position:absolute;top:-100px;right:-100px;width:300px;height:300px;background:radial-gradient(circle,rgba(212,165,116,.25),transparent 70%);border-radius:50%}
.hero-content{display:flex;gap:24px;align-items:center;flex-wrap:wrap;position:relative;z-index:1}
.hero-av{width:100px;height:100px;border-radius:50%;background:linear-gradient(135deg,var(--caramel),var(--terra));display:flex;align-items:center;justify-content:center;color:white;font-weight:700;font-size:36px;border:4px solid rgba(255,255,255,.2);flex-shrink:0}
.hero-info{flex:1;min-width:200px}
.hero-name{font-size:26px;font-weight:700;margin-bottom:6px}
.hero-pos{font-size:15px;opacity:.85;margin-bottom:10px}
.hero-meta{display:flex;gap:10px;flex-wrap:wrap}
.meta-item{background:rgba(255,255,255,.12);padding:5px 12px;border-radius:20px;font-size:12px;font-weight:600}
.hero-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-top:20px;position:relative;z-index:1}
.hstat{background:rgba(255,255,255,.1);border-radius:12px;padding:14px;border:1px solid rgba(255,255,255,.1)}
.hstat-label{font-size:11px;opacity:.7;text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px}
.hstat-val{font-size:20px;font-weight:700}

.block{background:white;border-radius:16px;padding:24px;box-shadow:0 4px 20px rgba(62,39,35,.08);border:1px solid rgba(212,165,116,.15);margin-bottom:20px}
.block-head{display:flex;align-items:center;gap:12px;margin-bottom:18px;padding-bottom:14px;border-bottom:1px solid rgba(212,165,116,.15)}
.block-icon{width:44px;height:44px;border-radius:12px;background:linear-gradient(135deg,var(--wheat),var(--caramel));display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:20px}
.block-title{font-size:17px;font-weight:700}
.block-sub{font-size:12px;color:var(--choc);opacity:.7}

.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:20px}

.duty-list{list-style:none}
.duty-item{display:flex;gap:12px;padding:10px 12px;border-radius:10px;margin-bottom:6px;align-items:flex-start}
.duty-item:hover{background:var(--cream)}
.duty-num{width:24px;height:24px;border-radius:50%;background:var(--wheat);color:var(--dark);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0;margin-top:1px}
.duty-text{font-size:13px;flex:1}

.goal{background:linear-gradient(135deg,#FFF8F0,#FAF0E6);border-left:3px solid var(--caramel);padding:12px 16px;border-radius:0 10px 10px 0;margin-bottom:8px;font-size:13px}
.goal strong{color:var(--choc);display:block;margin-bottom:2px;font-size:12px;text-transform:uppercase;letter-spacing:.3px}

.right-item{display:flex;gap:10px;padding:8px 0;border-bottom:1px dashed rgba(212,165,116,.2);align-items:center}
.right-item:last-child{border-bottom:none}
.right-icon{width:20px;height:20px;border-radius:50%;background:var(--ok);color:white;display:flex;align-items:center;justify-content:center;font-size:11px;flex-shrink:0}
.right-text{font-size:13px}

.task-list{display:flex;flex-direction:column;gap:10px}
.task{background:var(--cream);border:1px solid rgba(212,165,116,.2);border-radius:12px;padding:14px 16px;display:flex;align-items:flex-start;gap:12px;flex-wrap:wrap}
.task:hover{border-color:var(--caramel);background:white}
.task-dot{width:10px;height:10px;border-radius:50%;margin-top:6px;flex-shrink:0}
.task-dot.pending{background:var(--warn)}
.task-dot.progress{background:var(--info)}
.task-dot.done{background:var(--ok)}
.task-dot.problem{background:var(--err)}
.task-body{flex:1;min-width:200px}
.task-title{font-size:14px;font-weight:600;margin-bottom:4px}
.task-meta{font-size:12px;color:var(--choc);opacity:.8}
.task-actions{display:flex;gap:6px;flex-wrap:wrap}
.btn-sm{padding:6px 12px;font-size:12px;border-radius:8px;font-weight:600;background:var(--wheat);color:var(--dark)}
.btn-sm:hover{background:var(--caramel)}
.btn-sm.danger{background:#FDECEA;color:var(--err)}
.btn-sm.success{background:#E8F0E3;color:var(--ok)}
.tag{display:inline-block;padding:3px 10px;border-radius:10px;font-size:11px;font-weight:600}
.tag.pending{background:#FFF3E0;color:#E0A458}
.tag.progress{background:#E3F2FD;color:#1976D2}
.tag.done{background:#E8F0E3;color:var(--ok)}
.tag.problem{background:#FDECEA;color:var(--err)}

.toast{position:fixed;bottom:24px;right:24px;background:var(--dark);color:white;padding:14px 20px;border-radius:12px;box-shadow:0 10px 40px rgba(62,39,35,.12);font-size:14px;z-index:2000;animation:fadeIn .3s}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}

@media(max-width:900px){
.side{transform:translateX(-100%);width:260px}
.side.on{transform:translateX(0)}
.main{margin-left:0;padding:20px}
.menu-btn{display:flex!important}
.hero-av{width:80px;height:80px;font-size:28px}
.hero-name{font-size:22px}
}
.menu-btn{display:none;background:var(--choc);color:white;width:44px;height:44px;border-radius:10px;align-items:center;justify-content:center;margin-bottom:16px}
</style>
</head>

];

function renderLogin(){
  const list = document.getElementById('empList');
  list.innerHTML = GROUPS.map(g=>{
    const emps = EMP.filter(e=>g.levels.includes(e.level));
    if(!emps.length) return '';
    return `<div class="group">
      <div class="group-title">${g.title}<span class="badge">${emps.length} сотр.</span></div>
      <div class="grid">
        ${emps.map(e=>{
          const initials = e.name.split(' ').slice(0,2).map(s=>s[0]).join('');
          return `<div class="card" onclick="login(${e.id})">
            <div class="av">${initials}</div>
            <div class="info">
              <div class="nm">${e.name}</div>
              <div class="rl">${e.role} • Level ${e.level}</div>
              <span class="ps">🔑 ${e.pass}</span>
            </div>
            <button class="go">Войти →</button>
          </div>`;
        }).join('')}
      </div>
    </div>`;
  }).join('');
}

function login(id){
  const emp = EMP.find(e=>e.id===id);
  if(!emp){alert('Сотрудник не найден');return;}
  user = emp;
  sessionStorage.setItem('user',JSON.stringify(emp));
  showApp();
}

function logout(){
  user = null;
  sessionStorage.removeItem('user');
  document.getElementById('app').classList.remove('on');
  document.getElementById('loginPage').style.display = 'block';
}

function showApp(){
  document.getElementById('loginPage').style.display = 'none';
  document.getElementById('app').classList.add('on');
  renderUserCard();
  renderNav();
  page = 'profile';
  renderPage();
}

function renderUserCard(){
  const initials = user.name.split(' ').slice(0,2).map(s=>s[0]).join('');
  document.getElementById('uAv').textContent = initials;
  document.getElementById('uName').textContent = user.name;
  document.getElementById('uRole').textContent = user.role;
  document.getElementById('uLevel').textContent = 'Level ' + user.level;
}

function renderNav(){
  const items = [
    {id:'profile',icon:'👤',label:'Личный кабинет'},
    {id:'tasks',icon:'✅',label:'Мои задачи'},
    {id:'schedule',icon:'📅',label:'Мой график'},
    {id:'reports',icon:'📄',label:'Мои отчёты'},
    {id:'notifications',icon:'🔔',label:'Уведомления'},
    {id:'performance',icon:'📊',label:'Мои показатели'},
    {id:'instructions',icon:'📚',label:'Инструкции'}
  ];
  document.getElementById('navMenu').innerHTML = items.map(it=>
    `<div class="nav-item ${page===it.id?'on':''}" onclick="go('${it.id}')">${it.icon} ${it.label}</div>`
  ).join('');
}

function go(p){
  page = p;
  renderNav();
  renderPage();
  if(window.innerWidth<900) document.getElementById('sidebar').classList.remove('on');
}

function renderPage(){
  const c = document.getElementById('pageContent');
  if(page==='profile') c.innerHTML = renderProfile();
  else if(page==='tasks') c.innerHTML = renderTasks();
  else if(page==='schedule') c.innerHTML = renderSchedule();
  else if(page==='reports') c.innerHTML = renderReports();
  else if(page==='notifications') c.innerHTML = renderNotifications();
  else if(page==='performance') c.innerHTML = renderPerformance();
  else if(page==='instructions') c.innerHTML = renderInstructions();
}

              <div class="task-body">
                <div class="task-title">${t.title}</div>
                <div class="task-meta">Назначил: ${t.assigner} • Срок: ${t.deadline}</div>
              </div>
              <div class="task-actions">
                ${t.status!=='done'?`<button class="btn-sm success" onclick="markDone(${t.id})">✓ Выполнено</button>`:''}
                ${t.status!=='progress'&&t.status!=='done'?`<button class="btn-sm" onclick="markProg(${t.id})">▶ В работе</button>`:''}
              </div>
            </div>
          `).join('')}
        </div>
      `}
    </div>
  `;
}

function markDone(id){
  const t = (TASKS[user.level]||[]).find(x=>x.id===id);
  if(t){t.status='done';renderPage();toast('Задача выполнена ✓');}
}
function markProg(id){
  const t = (TASKS[user.level]||[]).find(x=>x.id===id);
  if(t){t.status='progress';renderPage();toast('Статус обновлён');}
}

function renderSchedule(){
  const d = DETAILS[user.level] || {shift:'07:00 – 16:00'};
  const today = new Date().getDay();
  const idx = today===0?6:today-1;
  const days = [
    {d:'Пн',h:d.shift,t:'work'},{d:'Вт',h:d.shift,t:'work'},{d:'Ср',h:'—',t:'off'},
    {d:'Чт',h:d.shift,t:'work'},{d:'Пт',h:d.shift,t:'work'},{d:'Сб',h:'09:00–15:00',t:'work'},{d:'Вс',h:'—',t:'off'}
  ];
  return `
    <h1 style="font-size:26px;font-weight:700;margin-bottom:24px">Мой график</h1>
    <div class="block">
      <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:8px">
        ${days.map((s,i)=>`
          <div style="background:${i===idx?'linear-gradient(135deg,var(--caramel),var(--terra))':s.t==='work'?'#E8F0E3':'var(--cream)'};border-radius:10px;padding:12px 8px;text-align:center;color:${i===idx?'white':'inherit'}">
            <div style="font-weight:700;margin-bottom:4px">${s.d}</div>
            <div style="font-size:11px;opacity:.8">${s.h}</div>
          </div>
        `).join('')}
      </div>
    </div>
  `;
}

function renderReports(){
  return `
    <h1 style="font-size:26px;font-weight:700;margin-bottom:24px">Мои отчёты</h1>
    <div class="block">
      <div style="text-align:center;padding:40px;color:var(--choc);opacity:.7">
        У вас пока нет отправленных отчётов
      </div>
    </div>
  `;
}

function renderNotifications(){
  return `
    <h1 style="font-size:26px;font-weight:700;margin-bottom:24px">Уведомления</h1>
    <div class="block">
      <div style="padding:12px;background:var(--cream);border-radius:10px;border-left:3px solid var(--caramel);margin-bottom:8px">
        <div style="font-size:13px">Добро пожаловать в систему Crust Issues Bakery!</div>
        <div style="font-size:11px;color:var(--choc);opacity:.7;margin-top:4px">15.11.2026 08:00</div>
      </div>
      <div style="padding:12px;background:white;border-radius:10px;border-left:3px solid var(--terra);margin-bottom:8px">
        <div style="font-size:13px">Новая задача назначена</div>
        <div style="font-size:11px;color:var(--choc);opacity:.7;margin-top:4px">15.11.2026 08:30</div>
      </div>
    </div>
  `;
}

function renderPerformance(){
  const tasks = TASKS[user.level] || [];
  const done = tasks.filter(t=>t.status==='done').length;
  const total = tasks.length;
  const pct = total>0?Math.round(done/total*100):0;
  return `
    <h1 style="font-size:26px;font-weight:700;margin-bottom:24px">Мои показатели</h1>
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin-bottom:24px">
      <div style="background:white;border-radius:16px;padding:20px;box-shadow:0 4px 20px rgba(62,39,35,.08)">
        <div style="font-size:12px;color:var(--choc);text-transform:uppercase;font-weight:600">Задач выполнено</div>
        <div style="font-size:26px;font-weight:700;margin-top:4px">${done} / ${total}</div>
      </div>
      <div style="background:white;border-radius:16px;padding:20px;box-shadow:0 4px 20px rgba(62,39,35,.08)">
        <div style="font-size:12px;color:var(--choc);text-transform:uppercase;font-weight:600">Эффективность</div>
        <div style="font-size:26px;font-weight:700;margin-top:4px">${pct}%</div>
      </div>
      <div style="background:white;border-radius:16px;padding:20px;box-shadow:0 4px 20px rgba(62,39,35,.08)">
        <div style="font-size:12px;color:var(--choc);text-transform:uppercase;font-weight:600">Опозданий</div>
        <div style="font-size:26px;font-weight:700;margin-top:4px">0</div>
      </div>
    </div>
  `;
}

function renderInstructions(){
  const L = user.level;
  const inst = {
    13:['Стратегия развития сети','Порядок утверждения бюджетов','Регламент работы с управляющими','Политика качества'],
    12:['Стандарт работы пекарни','Регламент проверки точек','Порядок взаимодействия','KPI для пекарен'],
    11:['Технологические стандарты','Порядок разработки рецептур','СанПиН','Контроль качества'],
    10:['Положение о бухучёте','Порядок инвентаризации','Налоговый регламент','Финансовая отчётность'],
    9:['Регламент работы с поставщиками','Порядок согласования закупок','Стандарты приёмки','Договорные условия'],
    8:['Правила трудового распорядка','Порядок контроля активности','Регламент работы с задачами','Политика уведомлений'],
    7:['Стандарт открытия/закрытия','Регламент работы с персоналом','Порядок работы с кассой','Стандарт обслуживания'],
    6:['Технологические карты','Порядок распределения задач','Стандарты качества','Регламент фиксации брака'],
    5:['Правила хранения','Порядок приёмки','Регламент выдачи','СанПиН для складов'],
    4:['Технологические карты хлеба','Порядок подготовки теста','Стандарты выпечки','Санитарные правила'],
    '4k':['Технологические карты десертов','Порядок приготовления кремов','Стандарты украшения','Санитарные правила'],
    3:['Стандарт обслуживания','Порядок работы с кассой','Правила выкладки','Скрипты продаж'],
    2:['Инструкция по подготовке','Порядок помощи пекарям','Санитарные правила','Правила мытья'],
    1:['График уборки','Инструкция по средствам','СанПиН','Правила утилизации']
  };
  const list = inst[L] || [];
  return `
    <h1 style="font-size:26px;font-weight:700;margin-bottom:24px">Рабочие инструкции</h1>
    <div class="block">
      <div class="task-list">
        ${list.map(t=>`
          <div class="task">
            <div class="task-dot done"></div>
            <div class="task-body"><div class="task-title">${t}</div><div class="task-meta">Обновлено: 01.11.2026</div></div>
            <button class="btn-sm" onclick="toast('Открыт документ: ${t}')">Открыть</button>
          </div>
        `).join('')}
      </div>
    </div>
  `;
}

function toast(msg){
  const t = document.createElement('div');
  t.className = 'toast';
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(()=>t.remove(),3000);
}

renderLogin();
const saved = sessionStorage.getItem('user');
if(saved){
  user = JSON.parse(saved);
  showApp();
}
</script>
</body>
